<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />

    <!-- =====================
    Mobile viewport
  ===================== -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Eesti Flashcards</title>

    <!-- =====================
    Styles
  ===================== -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#121212" />
  </head>

  <body>
    <div class="card">
      <!-- =====================
      Topic selector
    ===================== -->
      <div class="topic-select">
        <button onclick="toggleTheme()" id="themeBtn">🌙</button>
        <select id="topics" onchange="selectTopic(this.value)">
          <option value="" disabled selected>📚 Оберіть тему</option>
        </select>
      </div>

      <!-- =====================
      Question & Answer
    ===================== -->
      <!-- =====================
  Card content
===================== -->
      <div class="flip-card">
        <div class="flip-inner" id="flipCard">
          <div class="flip-front">
            <h3 id="question"></h3>
          </div>

          <div class="flip-back">
            <div id="answer"></div>
          </div>
        </div>
      </div>

      <!-- =====================
      Top buttons
    ===================== -->
      <div class="top-buttons">
        <button onclick="toggleAnswer()">Показати</button>
        <button onclick="reverse = !reverse; render()">🔄</button>
        <button onclick="location.href='stats.html'">📊</button>
        <div class="repeat-buttons">
  <button onclick="repeatToday()">🔁 Повторити сьогодні</button>
  <button onclick="repeatDifficult()">🔥 Складні</button>
  <button onclick="exitRepeat()">❌ Вийти</button>
</div>

      </div>

      <div class="hint">⬅️ ❌ &nbsp; ⬆️ 😎 &nbsp; ➡️ 🙂 &nbsp; ⬇️ 🤔</div>

      <!-- =====================
      Stats
    ===================== -->
      <div class="stats" id="stats"></div>
    </div>

    <!-- =====================
    Grade buttons
  ===================== -->
    <div class="grade-bar">
      <button onclick="grade(0)">❌</button>
      <button onclick="grade(1)">🤔</button>
      <button onclick="grade(2)">🙂</button>
      <button onclick="grade(3)">😎</button>
    </div>

    <!-- =====================
    Scripts
  ===================== -->
    <script src="data/words.js"></script>
    <script src="js/app.js"></script>
    <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js");
    });
  }
</script>

    <meta name="theme-color" content="#121212" />
  </body>
</html>
